spring:
  application:
    name: presence-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/presence"
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  # The one connection of the service (HAS-476): the virtual host of the notifications, where it tells
  # the technical channel that the detection does not run (NotificationPublisher of cholewa-commons). It
  # consumes nothing and declares nothing. Confirms, returns and the mandatory flag are what the publisher
  # needs to know a notification reached a queue; it refuses to start without them
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: notification
    # no default on purpose: cholewa.required-properties refuses the start without it
    password: ${rabbitmq-password}
    virtual-host: /notification
    connection-timeout: 10s
    requested-heartbeat: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # defaults to false; without it the trace breaks at the broker
      observation-enabled: true

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
  notification:
    enabled: true
    env: prod

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows
    # (heating 4 / database 6 / water 4 / presence 2, 6 free for Flyway and tools); left out, the
    # pool silently falls back to the library default of 4
    max-size: 2

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform - and kept in the shared
      # document, where the paths can be exercised locally on 8009 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json
  obfuscate:
    headers:
      - X-API-Key

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
    
#host and api-key are deliberately absent: both are validated at startup, so a deployment
#that forgot UNIFI_HOST or UNIFI_API_KEY fails with the name of the property instead of
#running and answering 502
unifi:
  site: Default
  # the certificate the gateway serves since 2026-11-17, valid until 2029-02-18 (HAS-476); a new one makes every
  # pass fail with "UniFi unreachable: CertificateException" - and, after presence.alert.skipped-after, an alert
  certificate-fingerprint: "87:C0:15:BD:F1:B4:61:FE:CA:A8:51:65:2C:1B:95:12:8A:72:67:6B:53:FD:F2:95:BA:DC:91:13:D9:B6:B3:EE"

#the household registry is read from database-service inside the cluster, over k8s DNS
registry:
  base-url: http://database-service:6200

presence:
  absence-threshold: PT10M
  # history older than this (by the last check of a row) is deleted once a day
  retention: P365D
  retention-cron: "0 0 3 * * *"
  # no pass evaluated for this long is an alert on the technical channel, reminded every hour, and one
  # info when a pass is evaluated again (HAS-476); a bare number is minutes
  alert:
    skipped-after: PT10M

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

cholewa:
  notification:
    # a run outside the cluster publishes into the dev queue, never to the channel of the house
    env: dev

registry:
  base-url: http://localhost:6005

server:
  port: 6009
management:
  server:
    port: 8009

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  # nothing listens here: a test that reaches the broker fails instead of publishing
  rabbitmq:
    host: localhost
    port: 1
    password: test

cholewa:
  notification:
    env: dev

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
      
unifi:
  host: localhost
  api-key: test-key

#a context started by a test must not poll a gateway that is not there, nor delete from a
#database that is not there
presence:
  detection-enabled: false
  retention-cron: "-"
