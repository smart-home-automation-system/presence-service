spring:
  application:
    name: presence-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/presence"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform - and kept in the shared
      # document, where the paths can be exercised locally on 8009 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json
  obfuscate:
    headers:
      - X-API-Key

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
    
unifi:
  host: localhost
  site: Default
  certificate-fingerprint: "94:37:F6:2E:A1:15:F8:EF:D8:09:9D:2B:69:69:75:CC:A7:50:B3:49:6C:DD:BA:24:B8:6F:66:D3:5D:4B:3B:7F"

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6009
management:
  server:
    port: 8009

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

