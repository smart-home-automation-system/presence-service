spring:
  application:
    name: presence-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/presence"
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows
    # (heating 8 / database 6 / water 4 / presence 2, 2 free for Flyway and tools); left out, the
    # pool silently falls back to the library default of 4
    max-size: 2

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform - and kept in the shared
      # document, where the paths can be exercised locally on 8009 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json
  obfuscate:
    headers:
      - X-API-Key

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
    
#host and api-key are deliberately absent: both are validated at startup, so a deployment
#that forgot UNIFI_HOST or UNIFI_API_KEY fails with the name of the property instead of
#running and answering 502
unifi:
  site: Default
  certificate-fingerprint: "94:37:F6:2E:A1:15:F8:EF:D8:09:9D:2B:69:69:75:CC:A7:50:B3:49:6C:DD:BA:24:B8:6F:66:D3:5D:4B:3B:7F"

#the household registry is read from database-service inside the cluster, over k8s DNS
registry:
  base-url: http://database-service:6200

presence:
  absence-threshold: PT10M

---

spring:
  config:
    activate:
      on-profile: local

registry:
  base-url: http://localhost:6005

server:
  port: 6009
management:
  server:
    port: 8009

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
      
unifi:
  host: localhost
  api-key: test-key

#a context started by a test must not poll a gateway that is not there
presence:
  detection-enabled: false
